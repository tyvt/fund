# 红利低波策略参数。根因修复后的研究口径使用月末信号、下一交易日执行。
dividend_lowvol:
  alignment_mode: false
  rebalance_freq: M
  rebalance_day: -1
  holding_period: 20

  min_holdings: 10
  min_investment_pct: 1.0
  fallback_top_n: 100

  top_n: 10
  # 融合排序先保持 experimental；综合验收 9 项中至少 6 项通过后，
  # generate_robustness_report.py 才会建议将 fusion_mode 升级为 true。
  fusion_status: experimental
  fusion_mode: false
  fusion_candidate_n: 100
  dividend_weight: 0.50
  volatility_weight: 0.50
  max_holding: 13
  dividend_filter:
    mode: top
    top_n: 10

  dividend_yield_min: 0.03
  volatility_filter:
    mode: top
    top_n: 10

  rebalance_buffer:
    enabled: true
    max_sell_per_month: 3
    hold_threshold_multiplier: 3

  roe_percentile_min: 0.20
  debt_ratio_percentile_max: 0.80
  roe_volatility_max: 0.15

  weight_scheme: dividend_yield
  max_single_weight: 0.08
  small_cap_weight_max: 0.40
  industry_single_max: 0.20
  beta_low_min: 0.45
  beta_high_max: 0.81

  min_listed_days: 365
  exclude_st: true
  min_float_mv: 500000000
  min_daily_amount: 1000000

fusion:
  # 开发期 Newey-West t>=2 闸门裁决（output/t_stats/factor_t_stats.csv）。
  candidate_factors:
    - dividend_yield
    - volatility_60d
    - roe_ttm
    - fcf_ev
    - pe_industry_quantile
    - reversal_10d
  candidate_n: 100
  top_n: 20
  max_single_weight: 0.08
  hold_bonus: 0.10
  cost_threshold: 0.01
  factors:
    - volatility_60d
    - fcf_ev
    - reversal_10d
  directions:
    dividend_yield: 1
    volatility_60d: -1
    roe_ttm: 1
    fcf_ev: 1
    pe_industry_quantile: 1
    reversal_10d: 1
  weights:
    # 主配置在通过闸门②的因子池内严格等权。
    volatility_60d: 0.3333333333
    fcf_ev: 0.3333333333
    reversal_10d: 0.3333333333
