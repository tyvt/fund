backtest:
  start_date: '2015-01-01'
  end_date: '2024-12-31'
  initial_capital: 100000
  rebalance_freq: M
  rebalance_day: -1
  holding_period: 20
  commission: 0.0003
  min_commission: 0.0
  stamp_duty: 0.001
  slippage: 0.001
  adjusted_prices: true
  fractional_shares: true

selection:
  top_n: 10
  min_holdings: 10
  min_investment_pct: 1.0
  fallback_top_n: 100

hard_constraints:
  min_listed_days: 365
  exclude_st: true
  min_float_mv: 500000000
  min_daily_amount: 1000000

full_constraints:
  dividend_yield_min: 0.03
  volatility_60d_max: 0.25
  roe_percentile_min: 0.20
  debt_ratio_percentile_max: 0.80
  roe_volatility_max: 0.15
  max_single_weight: 0.08
  industry_single_max: 0.20
  small_cap_weight_max: 0.40
  beta_low_min: 0.45
  beta_high_max: 0.81

# 单因子诊断：只保留 ST、上市时间、市值和流动性硬约束，按股息率选 Top30。
dividend_yield_only:
  name: dividend_yield_only
  description: 股息率 Top30（月度调仓、等权、仅硬约束）
  selection:
    top_n: 30

# Full 策略交易成本消融。无成本版清零全部成本；低成本版仅降低可控成本，
# 仍保留法定卖出印花税；高成本版与当前 Full 配置完全一致。
full_no_cost:
  extends: full
  name: full_no_cost
  commission: 0.0
  slippage: 0.0
  stamp_duty: 0.0

full_low_cost:
  extends: full
  name: full_low_cost
  commission: 0.0001
  slippage: 0.0005
  stamp_duty: 0.001

full_high_cost:
  extends: full
  name: full_high_cost
  commission: 0.0003
  slippage: 0.001
  stamp_duty: 0.001

# 低波中间 60% Band + 条件保留/每月最多卖出 3 只。
lowvol_band_buffer:
  name: lowvol_band_buffer
  description: 低波 Q2-Q4、股息率 Top10 起选、Top30 保留缓冲
  volatility_filter:
    mode: band
    lower_quantile: 0.20
    upper_quantile: 0.80
  dividend_filter:
    mode: top
    top_n: 10
  rebalance_buffer:
    enabled: true
    max_sell_per_month: 3
    hold_threshold_multiplier: 3

# 低波 Top10 回滚 + 条件保留/每月最多卖出 3 只。
rollback_top_buffer:
  name: rollback_top_buffer
  description: 低波 Top10 + 调仓缓冲
  extends: full
  overrides:
    volatility_filter:
      mode: top
      top_n: 10
    dividend_filter:
      mode: top
      top_n: 10
    rebalance_buffer:
      enabled: true
      max_sell_per_month: 3
      hold_threshold_multiplier: 3

# 融合排序实验：100 只评分候选与 10 只目标持仓分离；8% 单票上限使
# 实际目标通常为 13 只，且禁止突破 max_holding。
fusion_experimental:
  name: fusion_experimental
  description: 股息率与低波融合排序（experimental）
  extends: full
  overrides:
    fusion_status: experimental
    fusion_mode: true
    fusion_candidate_n: 100
    dividend_weight: 0.50
    volatility_weight: 0.50
    max_holding: 13
    rebalance_buffer:
      enabled: true
      max_sell_per_month: 3
      hold_threshold_multiplier: 3

# 审计整改主配置：开发期纯化 IC Newey-West t>=2 的因子池内严格等权。
fusion_v2:
  name: fusion_v2
  description: t 统计闸门裁决后的三因子等权融合排序
  extends: full
  overrides:
    fusion_status: validation
    fusion_mode: true
    fusion_factors:
      - volatility_60d
      - fcf_ev
      - reversal_10d
    fusion_directions:
      dividend_yield: 1
      volatility_60d: -1
      roe_ttm: 1
      fcf_ev: 1
      pe_industry_quantile: 1
      reversal_10d: 1
    fusion_weights:
      volatility_60d: 0.3333333333
      fcf_ev: 0.3333333333
      reversal_10d: 0.3333333333
    fusion_min_valid_factors: 3
    fusion_candidate_n: 100
    top_n: 20
    min_holdings: 20
    max_holding: 20
    max_single_weight: 0.08
    hold_bonus: 0.10
    cost_threshold: 0.01
    overheat_filter_enabled: true
    overheat_quantile: 0.95
    rebalance_buffer:
      enabled: false

# V2 锁定协议规定的固定对照：低波 + FCF/EV + PE 行业分位，池内等权。
fusion_v2_control:
  name: fusion_v2_control
  description: 只留传统强因子的固定三因子对照
  extends: fusion_v2
  overrides:
    fusion_factors:
      - volatility_60d
      - fcf_ev
      - pe_industry_quantile
    fusion_weights:
      volatility_60d: 0.3333333333
      fcf_ev: 0.3333333333
      pe_industry_quantile: 0.3333333333
    fusion_min_valid_factors: 3

output:
  directory: output/ablation
